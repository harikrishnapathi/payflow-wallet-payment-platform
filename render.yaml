services:

  - type: web
    name: payflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: PayFlow

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: payflow-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: PAYMENT_PROVIDER
        value: mock

      - key: CORS_ORIGINS
        sync: false


  - type: web
    name: payflow-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist

    buildFilter:
      paths:
        - frontend/**

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


  - type: keyvalue
    name: payflow-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction


databases:

  - name: payflow-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"