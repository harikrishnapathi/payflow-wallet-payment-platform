services:

  - type: web
    name: payflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: PayFlow

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: PAYMENT_PROVIDER
        value: mock

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: CORS_ORIGINS
        sync: false


  - type: web
    name: payflow-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist

    buildFilter:
      paths:
        - frontend/**

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html